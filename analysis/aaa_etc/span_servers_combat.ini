#本次跨服战场活动的代号,必须保证每个活动代号的唯一性.
[name]
name=沙场点兵1

# 跨服战场需要用到的ADB,必须独立开辟一个新的ADB,不能重复
[adb]  
ip=222.246.130.98
database=adb
user=account
password=passowrd

# 跨服战场需要用到的DDB,必须独立开一个新的DDB,不能重复
[ddb]  
ip=222.246.130.98
database=ddb
user=account
password=passowrd

# 允许开放跨服战场报名的区组,以逗号分割
[allowed_dists]
allowed_dists=物华天宝,光宇内测

# 跨服战场区组名
[combat_dist]
combat_dist=沙场点兵

# 其他配置
[other_conf]
# 跨服战场中一条线开放战场的数目
battlefields=5
# 进入战场前的初始积分
init_score=1
# 玩家的最低等级
lowest_level=40
# 玩家的最高等级
highest_level=100

# 时间
[timetable]
# 报名开始的公告的开始时间
# 格式如下：
# 2008-12-17-18:00 to 2008-12-18-24:00
notice_time_for_sign_up=2008-5-15-12:00 to 2008-5-15-15:00
# 报名公告的间隔时间,单位s
interval_for_sign_up=300
# 报名时间
time_for_sign_up=2008-5-15-12:00 to 2008-5-15-15:00

# 开始播放登陆公告的时间
notice_time_for_load=2008-5-15-14:00 to 2008-5-15-15:00
# 开放服务器登陆公告的间隔时间,单位分钟
interval_for_load=300
# 跨服战场区组开放登陆的时间
time_for_load=2008-5-15-14:00 to 2008-5-15-15:00

# 战斗开始前30分钟，每隔5分钟播放一次
# 跨服战场中开始战斗的时间
time_for_start_combat=2008-5-15-15:30
# 跨服战场开始战斗的公告时间
notice_time_for_start_combat=1800
# 跨服战场开始战斗前公告的时间间隔
interval_for_start_combat=300

# 战斗结束前30分钟，每隔5分钟播放一次广播
# 跨服战场中战斗结束时间
time_for_end_combat=2008-5-15-18:00
# 跨服战场结束战斗的公告时间
notice_time_for_end_combat=1800
# 跨服战场战斗结束前公告的时间间隔
interval_for_end_combat=300

# 服务器关闭前5分钟，每隔1min钟播放一次
# 跨服战场关闭时间
time_for_close=2008-5-15-18:30
# 跨服战场关闭前的公告时间
notice_time_for_close=1800
# 跨服战场关闭前公告周期
interval_for_close=300
